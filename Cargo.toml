[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Capsulsaurus/Focale"
rust-version = "1.90"

[workspace.dependencies]
focale-buildinfo = { path = "crates/focale-buildinfo" }
focale-core = { path = "crates/focale-core" }
focale-export = { path = "crates/focale-export" }
focale-segment = { path = "crates/focale-segment" }
focale-sidecar = { path = "crates/focale-sidecar" }

avif-serialize = "0.8"
ciborium = "0.2"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
flate2 = "1"
half = "2"
jpeg-encoder = "0.7"
jpegxl-rs = { version = "0.15", features = ["vendored"] }
libm = "0.2"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
png = "0.18"
rav1e = { version = "0.8", default-features = false }
# default-features off: the default codec set pulls libwebp-sys, whose
# rawshift 0.1.1 bindings do not compile on aarch64 (c_char signedness).
rawshift-image = { version = "0.1.1", default-features = false, features = [
    "arw",
    "dng",
] }
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zune-jpeg = "0.5"

# Input ICC handling for embedded previews (colour-managed thumbnails and the
# view-only path). BSD-3-Clause OR Apache-2.0, plus num-traits (MIT/Apache-2.0)
# and pxfm (BSD-3-Clause/Apache-2.0) — all AGPL-compatible ([HARD-LICENSE]).
# Deliberately a `focale-app` dependency only: it is display-side and must
# never reach the deterministic export path, which generates its own output
# profiles in `focale-export::icc`.
moxcms = "0.9"
thiserror = "2"
tiff = "0.11"
tracing = "0.1"

[profile.release]
lto = "thin"

# Fast iterative builds for the heavy GUI/codec dependency graph.
[profile.dev.package."*"]
opt-level = 2
