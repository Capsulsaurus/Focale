[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Capsulsaurus/Focale"
rust-version = "1.90"

[workspace.dependencies]
focale-core = { path = "crates/focale-core" }
focale-export = { path = "crates/focale-export" }
focale-sidecar = { path = "crates/focale-sidecar" }

avif-serialize = "0.8"
ciborium = "0.2"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
flate2 = "1"
half = "2"
jpeg-encoder = "0.7"
jpegxl-rs = { version = "0.15", features = ["vendored"] }
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
png = "0.18"
rav1e = { version = "0.8", default-features = false }
rawshift-image = { version = "0.1.1", features = ["arw", "dng"] }
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zune-jpeg = "0.5"
thiserror = "2"
tiff = "0.11"
tracing = "0.1"

[profile.release]
lto = "thin"

# Fast iterative builds for the heavy GUI/codec dependency graph.
[profile.dev.package."*"]
opt-level = 2
