[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Capsulsaurus/Focale"
rust-version = "1.90"

[workspace.dependencies]
focale-core = { path = "crates/focale-core" }
focale-sidecar = { path = "crates/focale-sidecar" }

ciborium = "0.2"
half = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"

# Fast iterative builds for the heavy GUI/codec dependency graph.
[profile.dev.package."*"]
opt-level = 2
