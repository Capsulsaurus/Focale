name: Determinism

# docs/verification.md: export the same (raw + sidecar) on two architectures and
# diff bytes. Runs the full workspace test suite (golden-file and regression
# tests) on both, then byte-hashes focale-cli renders of the committed fixture
# in every export format and compares across architectures.
#
# Both steps are mise tasks from mise.toml; the render/hash step lives in
# scripts/determinism-hashes.sh so it can be reproduced locally with
# `mise run determinism`.

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Workspace tests (golden + regression suites)
        run: mise run test
      - name: Render fixture in every format and hash
        run: mise run determinism
        env:
          HASHES_OUT: hashes-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.arch }}
          path: hashes-${{ matrix.arch }}.txt

  compare:
    name: Compare architectures
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
      # The one workflow step that does not go through a mise task: this job
      # deliberately has no checkout (it only needs the two artifacts), so there
      # is no mise.toml here to run a task from.
      - name: Diff
        run: |
          set -euo pipefail
          cat hashes-x86_64.txt
          diff hashes-x86_64.txt hashes-aarch64.txt
          echo "bit-identical across x86_64 and aarch64"
