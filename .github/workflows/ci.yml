name: CI

# Every job runs a mise task from mise.toml — the same tasks the git hooks
# (hk.pkl) and developers run locally. Never inline a command here.

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mise run test
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tooling:
    name: Tooling config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run validate-hooks

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check commits
        run: mise run commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
