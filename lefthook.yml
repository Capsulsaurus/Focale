# Git hooks for Focale. pre-push replicates CI exactly (see justfile `check`).

commit-msg:
  commands:
    conventional-commit:
      # Merge commits are exempt (see CLAUDE.md); skip while git is mid-merge/rebase.
      skip:
        - merge
        - rebase
      run: convco check --from-stdin < {1}

pre-commit:
  commands:
    format-fix:
      glob: "**/*.rs"
      stage_fixed: true
      run: cargo fmt

pre-push:
  commands:
    format-check:
      run: cargo fmt --check
    lint-check:
      run: cargo clippy --workspace --all-targets -- -D warnings
    test:
      run: cargo test --workspace
    conventional-commits:
      run: convco check origin/master..HEAD
